<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão e Digitalização de Documentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<h1>Sistema unificado de Digitalização</h1>
<p>Painel do operador</p>
</header>
<main class="container">
    <!-- Formulário de Registro de Lote/Caixa -->
    <section class="card">
        <h2>1. Registrar Nova Caixa/Lote</h2>
        <form id="form-caixa">
            <div class="form-group">
                <label for="numero-caixa">Número da Caixa:</label>
                <input type="text" id="numero-caixa" placeholder="Ex: 053918" required>
            </div>
            <div class="form-group">
                <label for="tipo-documento">Tipo de Documento:</label>
                <input type="text" id="tipo-documento" placeholder="Ex: lista de presença, requerimento" required>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar Caixa</button>
        </form>
    </section>

    <!-- Controle de Etapa Operacional -->
    <section class="card">
        <h2>2. Controlo de Etapa & Processamento</h2>
        <form id="form-etapa">
            <div class="form-group">
                <label for="select-caixa">Selecionar Caixa:</label>
                <select id="select-caixa" required>
                    <option value="">Selecione uma caixa...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="etapa">Etapa Atual:</label>
                <select id="etapa" required>
                    <option value="Preparacao">Preparação </option>
                    <option value="Digitalizacao">Digitalização (Captura)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="qtd-folhas">Contagem de Folhas:</label>
                <input type="number" id="qtd-folhas" min="0" placeholder="0" required>
            </div>

            <div class="form-group">
                <label for="arquivo-pdf">Anexar PDF Digitalizado:</label>
                <input type="file" id="arquivo-pdf" accept=".pdf">
            </div>

            <button type="submit" class="btn btn-success">Finalizar e Registrar Etapa</button>
        </form>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
</body>
</html>
